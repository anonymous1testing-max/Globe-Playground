<!DOCTYPE html>
<html>
  <head>
    <title>Globe Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Load the 3D Globe Library -->
    <script src="https://webglearth.com"></script>
    <style>
      html, body {
        padding: 0;
        margin: 0;
        background-color: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #earth_div {
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        position: absolute !important;
      }
    </style>
    <script>
      function initialize() {
        // Build the 3D globe options
        var options = {
          atmosphere: true,
          sky: true,
          zoom: 2,
          position: [20, 0]
        };
        var earth = new WE.map('earth_div', options);
        
        // Add a beautiful natural satellite basemap layer
        WE.tileLayer('https://wmflabs.org{z}/{x}/{y}.png', {
          attribution: 'Globe Playground'
        }).addTo(earth);
      }
    </script>
  </head>
  <body onload="initialize()">
    <div id="earth_div"></div>
  </body>
</html>
